# --- 分流规则 ---
rules:
  # === 本地网络直连 ===
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve

  # === AI平台 (内联关键词先匹配, RULE-SET兜底) ===
  - DOMAIN-KEYWORD,openai,💬 Ai平台
  - DOMAIN-KEYWORD,chatgpt,💬 Ai平台
  - DOMAIN-KEYWORD,claude,💬 Ai平台
  - DOMAIN-KEYWORD,anthropic,💬 Ai平台
  - DOMAIN-KEYWORD,colab,💬 Ai平台
  - DOMAIN-KEYWORD,developerprofiles,💬 Ai平台
  - DOMAIN-KEYWORD,generativelanguage,💬 Ai平台
  - RULE-SET,openai,💬 Ai平台
  - RULE-SET,openai-ip,💬 Ai平台,no-resolve
  - RULE-SET,claude,💬 Ai平台
  - RULE-SET,googlegemini,💬 Ai平台
  - RULE-SET,ai,💬 Ai平台

  # === 社交 (Instagram / Twitter / Facebook / Whatsapp / Discord / Reddit) ===
  - DOMAIN-KEYWORD,instagram,📱 社交
  - DOMAIN-KEYWORD,twitter,📱 社交
  - DOMAIN-KEYWORD,facebook,📱 社交
  - DOMAIN-KEYWORD,fbcdn,📱 社交
  - DOMAIN-KEYWORD,whatsapp,📱 社交
  - DOMAIN-KEYWORD,discord,📱 社交
  - DOMAIN-KEYWORD,reddit,📱 社交
  - DOMAIN-SUFFIX,t.co,📱 社交
  - DOMAIN-SUFFIX,fb.com,📱 社交
  - RULE-SET,instagram,📱 社交
  - RULE-SET,social,📱 社交
  - RULE-SET,social-ip,📱 社交,no-resolve

  # === 流媒体 (YouTube / Netflix / Disney+ / HBO Max / Prime Video / Twitch / Spotify) ===
  - DOMAIN-KEYWORD,youtube,🎬 流媒体
  - DOMAIN-KEYWORD,googlevideo,🎬 流媒体
  - DOMAIN-KEYWORD,netflix,🎬 流媒体
  - DOMAIN-KEYWORD,disney,🎬 流媒体
  - DOMAIN-KEYWORD,hbo,🎬 流媒体
  - DOMAIN-KEYWORD,primevideo,🎬 流媒体
  - DOMAIN-KEYWORD,twitch,🎬 流媒体
  - DOMAIN-KEYWORD,spotify,🎬 流媒体
  - DOMAIN-KEYWORD,avoddashs,🎬 流媒体
  - DOMAIN-KEYWORD,ttvnw,🎬 流媒体
  - RULE-SET,proxymedia,🎬 流媒体
  - RULE-SET,proxymedia-ip,🎬 流媒体,no-resolve
  - RULE-SET,netflix,🎬 流媒体
  - RULE-SET,streaming,🎬 流媒体
  - RULE-SET,streaming-ip,🎬 流媒体,no-resolve

  # === TikTok ===
  - DOMAIN-KEYWORD,tiktok,🏷️ TikTok
  - RULE-SET,tiktok,🏷️ TikTok

  # === Telegram ===
  - DOMAIN-KEYWORD,telegram,📲 电报消息
  - RULE-SET,telegram,📲 电报消息
  - RULE-SET,telegram-ip,📲 电报消息,no-resolve
  - RULE-SET,telegramcidr,📲 电报消息,no-resolve

  # === Google (Google + Google FCM 合一) ===
  # apis.google.com 是 Google 全系共用的 API JS 加载网关（搜索页也会拉），
  # 曾被 blackmatrix7 误放进 Gemini 分类导致谷歌搜索被 AI 组截走，已剔除并在此显式接管。
  - DOMAIN-SUFFIX,apis.google.com,🔍 Google
  - RULE-SET,google,🔍 Google
  - RULE-SET,google-ip,🔍 Google,no-resolve
  - RULE-SET,googlefcm,🔍 Google
  - RULE-SET,googlefcm-ip,🔍 Google,no-resolve

  # === Apple ===
  - RULE-SET,apple,🍎 苹果服务,no-resolve

  # === 开发者 (GitHub / GitLab / Bitbucket / Docker Hub / npmjs / PyPI) ===
  - DOMAIN-KEYWORD,github,💻 开发者
  - DOMAIN-SUFFIX,github.com,💻 开发者
  - DOMAIN-KEYWORD,gitlab,💻 开发者
  - DOMAIN-KEYWORD,bitbucket,💻 开发者
  - DOMAIN-SUFFIX,docker.io,💻 开发者
  - DOMAIN-SUFFIX,docker.com,💻 开发者
  - DOMAIN-SUFFIX,registry.npmjs.org,💻 开发者
  - DOMAIN-SUFFIX,npmjs.com,💻 开发者
  - DOMAIN-SUFFIX,npmjs.org,💻 开发者
  - DOMAIN-SUFFIX,pypi.org,💻 开发者
  - DOMAIN-SUFFIX,pythonhosted.org,💻 开发者
  - RULE-SET,github,💻 开发者
  - RULE-SET,dev,💻 开发者

  # === Microsoft ===
  - RULE-SET,bing,🔎 微软 Bing
  - DOMAIN-KEYWORD,1drv,☁️ 微软云盘
  - DOMAIN-KEYWORD,onedrive,☁️ 微软云盘
  - DOMAIN-KEYWORD,skydrive,☁️ 微软云盘
  - DOMAIN-SUFFIX,sharepoint.com,☁️ 微软云盘
  - DOMAIN-SUFFIX,storage.live.com,☁️ 微软云盘
  - RULE-SET,onedrive,☁️ 微软云盘
  # 内联兜底: 防止 provider 加载失败时 Outlook / Office365 / Store 被拉去直连
  - DOMAIN-SUFFIX,hotmail.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,live.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,msn.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,office.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,office.net,🖥️ 微软服务
  - DOMAIN-SUFFIX,office365.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,microsoft.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,azure.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,microsoftonline.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,windows.com,🖥️ 微软服务
  - DOMAIN-SUFFIX,windows.net,🖥️ 微软服务
  - DOMAIN-SUFFIX,bing.com,🖥️ 微软服务
  - RULE-SET,microsoft,🖥️ 微软服务

  # === PikPak 网盘（Web / API / App / 下载 CDN 全程走 🚀 节点选择）===
  # 必须放在「中国直连」之前，原因有两条：
  #   1) 下载 CDN 是 *.sandai.net（与迅雷共用该后缀），而 sandai.net 在 ChinaDomain 里，会被判直连；
  #   2) 这些 CDN 子域解析到国内 IP（阿里云 / 联通），ChinaIp 与 GEOIP,CN 也会把它们拉去直连。
  # 用 DOMAIN-KEYWORD,pikpak 一次覆盖全部品牌域名（pikpak.com / mypikpak.com / mypikpak.net /
  # pikpak.me / pikpak.app / pikpak.org / pikpakapp.com / pikpakdrive.com 及其子域），
  # 新增品牌域名无需再改；CDN 子域关键词覆盖不到，逐条列出。
  - DOMAIN-KEYWORD,pikpak,🚀 节点选择
  - DOMAIN-SUFFIX,dlandroid.rcv.sandai.net,🚀 节点选择
  - DOMAIN-SUFFIX,hub5idx.v6.shub.sandai.net,🚀 节点选择
  - DOMAIN-SUFFIX,hub5pn.wap.sandai.net,🚀 节点选择
  - DOMAIN-SUFFIX,hub5pnc.sandai.net,🚀 节点选择
  - DOMAIN-SUFFIX,hub5pr.v6.phub.sandai.net,🚀 节点选择
  - DOMAIN-SUFFIX,hubciddata.sandai.net,🚀 节点选择

  # === 中国直连 ===
  - RULE-SET,chinadomain,🎯 全球直连
  - RULE-SET,chinaip,🎯 全球直连,no-resolve
  - RULE-SET,chinaipv6,🎯 全球直连,no-resolve
  - GEOIP,CN,🎯 全球直连

  # === GFWlist 兜底 ===
  - RULE-SET,gfwlist,🚀 节点选择

  # === 最终兜底 ===
  - DOMAIN-SUFFIX,cn,🎯 全球直连
  - MATCH,🐟 漏网之鱼
