name: Daily Rule Update

on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate providers
        run: |
          python3 scripts/generate_providers.py

      - name: Validate YAML
        run: |
          pip install pyyaml
          python3 - <<'EOF'
          import yaml, glob, sys
          ok = True
          for f in glob.glob("stash/providers/*.yaml"):
              try:
                  d = yaml.safe_load(open(f))
                  assert isinstance(d, dict) and "payload" in d
                  # domain 文件: 只能裸域名/通配符
                  if "_domain.yaml" in f:
                      for e in d["payload"]:
                          assert not e.startswith(("DOMAIN-", "IP-", "PROCESS-")), f"bad domain entry: {e}"
                  # ipcidr 文件: 只能裸 CIDR
                  if "_ipcidr.yaml" in f:
                      for e in d["payload"]:
                          assert "/" in e, f"bad ipcidr entry: {e}"
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  ok = False
          try:
              d = yaml.safe_load(open("stash/stash-full.yaml"))
              assert len(d.get("rule-providers", {})) >= 20
          except Exception as e:
              print(f"FAIL template: {e}")
              ok = False
          print("YAML validation:", "OK" if ok else "FAILED")
          sys.exit(0 if ok else 1)

      # 推送前自校验：与 PR 上的「规则集校验」跑同一个脚本。
      # 上游规则坏了 / 生成逻辑出偏差时，这一步直接红 → 下面的 commit+push 根本不执行，
      # 坏规则不会进 main。
      # 为什么放在这里而不是靠 ruleset 硬拦：本仓是个人账号仓库，GitHub 不允许把
      # Actions app 加进 ruleset 的 bypass 列表，而 required check 会连本步的直推一起挡
      # （实测 GH013）。所以改为在推送源头自校验 + PR 侧读回「规则集校验」。
      - name: 规则集自校验（provider 存在性 / RULE-SET 引用 / 广告残留 / 组名）
        run: python3 scripts/verify_stash.py

      - name: Commit and push if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "stash-rulesets-bot"
          git config user.email "ipevel@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: daily rule update $(date -u +%Y-%m-%d)"
            git push origin main
            echo "Pushed updates"
          fi
